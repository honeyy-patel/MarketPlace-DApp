<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Decentralized Marketplace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body.dark-mode {
      background-color: #121212;
      color: #f1f1f1;
    }
    .dark-mode .card {
      background-color: #1e1e1e;
      color: white;
    }
    .card-img-top {
      object-fit: cover;
      height: 200px;
    }
  </style>
</head>
<body>
  <div class="container my-4">
    <div class="text-center mb-4">
      <h1>🛒 Decentralized Marketplace</h1>
      <button class="btn btn-secondary" onclick="toggleDarkMode()">Toggle Dark Mode</button>
    </div>

    <div class="text-center mb-3">
      <p><strong>Connected Wallet:</strong> <span id="userAccount">Not connected</span></p>
    </div>

    <div class="mb-4">
      <input type="text" id="search" class="form-control" placeholder="Search items...">
    </div>

    <hr>
    <form id="sellForm">
      <input id="articleName" class="form-control mb-2" type="text" placeholder="Item Name" required />
      <input id="articleDescription" class="form-control mb-2" type="text" placeholder="Item Description" required />
      <input id="articlePrice" class="form-control mb-2" type="number" step="0.01" placeholder="Price in ETH" required />
      <button type="submit" class="btn btn-primary">List Item</button>
    </form>
    
    <hr>
    <div id="articlesRow" class="row g-4">
      <!-- Items will be injected here -->
    </div>
  </div>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }

    document.getElementById("search").addEventListener("input", function () {
      const query = this.value.toLowerCase();
      document.querySelectorAll("#articlesRow .card").forEach(card => {
        const title = card.querySelector(".card-title").textContent.toLowerCase();
        card.parentElement.style.display = title.includes(query) ? "block" : "none";
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
